name: Build iOS app

on:
  workflow_dispatch:
  push:
    branches: [main, theme/build-26-neutral-refresh]

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Generate Liverpool-inspired app icon
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install Pillow
          .venv/bin/python scripts/generate_app_icon.py
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned app
        run: xcodebuild -project FC27TrophyTracker.xcodeproj -scheme FC27TrophyTracker -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -path '*/Build/Products/Release-iphoneos/FC27TrophyTracker.app' -print -quit)
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r FC27TrophyTracker-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: FC27TrophyTracker-unsigned-IPA-intel
          path: FC27TrophyTracker-unsigned.ipa
          retention-days: 14
